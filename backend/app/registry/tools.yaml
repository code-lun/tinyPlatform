# ============================================================
# 工具注册配置文件
# 修改后无需重启服务（需启用热加载）或者直接restart容器
# ============================================================

tools:
  - name: get_time
    display_name: 获取系统时间
    description: 获取当前系统时间，包含日期时间、毫秒时间戳和时区信息
    script: get_time.sh
    category: 系统信息
    params: []
    timeout: 10
    enabled: true
    tags:
      - 时间
      - 系统

  - name: sys_check
    display_name: 系统资源巡检
    description: 系统资源巡检，检查 CPU、内存、磁盘、网络等资源使用情况
    script: sys_check.sh
    category: 资源巡检
    params: []
    timeout: 30
    enabled: true
    tags:
      - 资源
      - 监控
      - 巡检

  - name: reload_tools
    display_name: 重载工具注册表
    description: 重新加载工具注册表，使新添加或修改的工具定义生效（无需重启服务）
    script: reload_tools.py
    category: 系统管理
    params: []
    timeout: 30          # 重载操作可能涉及文件扫描，预留充足时间
    enabled: true
    tags:
      - 系统
      - 管理

  - name: sleep_test
    display_name: 睡眠测试
    description: 执行系统睡眠，用于测试任务挂起、超时控制或后台调度，默认睡眠 5 分钟（300 秒）
    script: sleep_test.sh
    category: 系统工具
    params:
      - name: seconds
        display_name: 睡眠时长（秒）
        description: 睡眠时间，单位为秒，默认 300（5 分钟）
        type: integer
        required: false
        default: 300
        validation:
          min: 1
          max: 86400  # 最大 24 小时
    timeout: 400      # 略大于默认睡眠时间，预留缓冲
    enabled: true
    tags:
      - 睡眠
      - 测试
      - 系统