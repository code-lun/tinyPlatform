# ============================================================
# 运维工具平台 - Docker Compose 编排
# ============================================================

services:
  # ---- 后端 API 服务 ----
  backend:
    image: platform:v2.6
    container_name: tinyPlatform-backend
    ports:
      - "8000:8000"
    volumes:
      # 挂载脚本目录（脚本变更无需重建镜像）
      - ./scripts:/scripts:ro
      # 挂载日志目录（持久化日志文件）
      - ./logs:/logs
      - ./backend/.env:/etc/.env
      - ./backend/app/registry/tools.yaml:/etc/tools.yaml
    environment:
      # token禁止放在yml，放在env里面，挂载形式是用
      # - API_TOKEN=${API_TOKEN:-tinyPlatform-token-2024}
      - SCRIPTS_DIR=/scripts
      - SCRIPT_TIMEOUT=30
      - EXECUTOR_MAX_WORKERS=${EXECUTOR_MAX_WORKERS:-}
      - EXECUTOR_QUEUE_SIZE=${EXECUTOR_QUEUE_SIZE:-}
      - EXECUTOR_QUEUE_WAIT_TIMEOUT=${EXECUTOR_QUEUE_WAIT_TIMEOUT:-}
      - EXECUTOR_MAX_CONCURRENT_SCRIPTS=${EXECUTOR_MAX_CONCURRENT_SCRIPTS:-}
      - EXECUTOR_RESULT_TTL=${EXECUTOR_RESULT_TTL:-}
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/logs
      - LOG_FILE_ENABLED=${LOG_FILE_ENABLED:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---- MCP 服务（Streamable HTTP 模式） ----
  mcp:
    image: platform-mcp:v2.6
    container_name: tinyPlatform-mcp
    ports:
      - "8080:8080"
    volumes:
      # 挂载日志目录（持久化日志文件）
      - ./logs:/logs
      - ./mcp/.env:/etc/.env
    environment:
      - BACKEND_API_URL=http://backend:8000
      # token禁止放在yml，放在env里面，挂载形式是用
      # - API_TOKEN=${API_TOKEN:-tinyPlatform-token-2024}
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - REQUEST_TIMEOUT=30
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/logs
      - LOG_FILE_ENABLED=${LOG_FILE_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
